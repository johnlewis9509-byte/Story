<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>My Story Shelf</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FF8FA3">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Lexend:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #EAF6F0;
    --paper: #FFFDF8;
    --ink: #1F4B43;
    --ink-soft: #4A7168;
    --animals: #FF9376;
    --animals-dark: #E06F50;
    --fairy: #B983FF;
    --fairy-dark: #9457E0;
    --adventure: #3FBEEA;
    --adventure-dark: #1D97C2;
    --friend: #FFC93C;
    --friend-dark: #E8A800;
    --hindi: #FF6FA8;
    --hindi-dark: #E23E7F;
    --radius: 26px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background-image: url('https://raw.githubusercontent.com/johnlewis9509-byte/Story/refs/heads/main/Banner2.png');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    color: var(--ink);
    font-family: 'Lexend', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }
  #app { max-width: 640px; margin: 0 auto; padding: 24px 20px 60px; min-height: 100vh; }

  /* ---------- HOME HERO ---------- */
  .hero-scene {
    position: relative; overflow: hidden;
    border-radius: var(--radius);
    background-image: url('https://raw.githubusercontent.com/johnlewis9509-byte/Story/refs/heads/main/banner1.png');
    background-size: cover;
    background-position: center;
    padding: 22px 18px 26px;
    margin-bottom: 18px;
    box-shadow: 0 6px 0 rgba(0,0,0,0.08);
    min-height: 180px;
  }
  .hero-scene svg.hero-bg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .hero-content { position: relative; z-index: 2; }
  .bubble-title {
    font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 34px;
    line-height: 1.05; margin: 0; text-shadow: 2px 2px 0 rgba(255,255,255,0.5);
  }
  .bubble-title .l1 { color: #2E86DE; }
  .bubble-title .l2 { color: #E8546B; }
  .bubble-title .l3 { color: #2E9E4F; }
  .bubble-title .l4 { color: #9457E0; }
  .wood-sign {
    display: inline-block; margin-top: 10px; padding: 10px 16px;
    background: linear-gradient(155deg, #D8A15C, #B5793A);
    color: #3B2410; font-weight: 600; font-size: 13.5px;
    border-radius: 10px; box-shadow: 0 3px 0 rgba(0,0,0,0.18);
    border: 2px solid #93602A;
  }
  .greet-badge {
    position: absolute; top: 14px; right: 14px; z-index: 3;
    display: flex; align-items: center; gap: 8px;
    background: rgba(255,255,255,0.95); border-radius: 999px;
    padding: 5px 14px 5px 5px; box-shadow: 0 3px 10px rgba(0,0,0,0.15);
  }
  .greet-badge .avatar { width: 34px; height: 34px; border-radius: 50%; overflow: hidden; background: #FFE9C7; flex: none; }
  .greet-badge .avatar svg { width: 100%; height: 180%; margin-top: -14%; }
  .greet-badge span { font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 12.5px; color: var(--ink); }

  .wood-sign-mini {
    margin-top: 18px; padding: 10px 14px; font-size: 12px; font-weight: 600;
    color: #3B2410; background: linear-gradient(155deg, #E8C088, #C79052);
    border-radius: 8px; border: 2px solid #93602A; display: inline-block;
    box-shadow: 0 2px 0 rgba(0,0,0,0.15);
  }

  /* ---------- CATEGORY CARDS ---------- */
  .cat-list {
    display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
    margin-bottom: 18px;
  }
  .cat-card {
    border: none; cursor: pointer; text-align: left;
    display: flex; flex-direction: column; align-items: flex-start; gap: 10px;
    border-radius: 24px; padding: 20px 18px;
    color: white; font-family: 'Lexend', sans-serif;
    box-shadow: 0 6px 0 rgba(0,0,0,0.12);
    transition: transform .12s ease, box-shadow .12s ease;
    min-height: 176px; width: 100%;
  }
  .cat-card:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,0.12); }
  .cat-card.animals { background: linear-gradient(150deg, var(--animals), var(--animals-dark)); }
  .cat-card.fairy { background: linear-gradient(150deg, var(--fairy), var(--fairy-dark)); }
  .cat-card.adventure { background: linear-gradient(150deg, var(--adventure), var(--adventure-dark)); }
  .cat-card.friend { background: linear-gradient(150deg, var(--friend), var(--friend-dark)); }
  .cat-card.hindi { background: linear-gradient(150deg, var(--hindi), var(--hindi-dark)); }
  .cat-icon-badge {
    width: 68px; height: 68px; border-radius: 50%; flex: none;
    background: rgba(255,255,255,0.35);
    display: flex; align-items: center; justify-content: center;
    box-shadow: inset 0 2px 4px rgba(255,255,255,0.4);
  }
  .cat-icon-badge svg { width: 46px; height: 46px; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.15)); }
  .cat-card .cat-text { width: 100%; }
  .cat-card .cat-name { font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 20px; display: block; line-height: 1.15; }
  .cat-card .cat-count { font-size: 12.5px; opacity: .92; margin-top: 4px; display: block; }
  .cat-arrow {
    align-self: flex-end; width: 36px; height: 36px; border-radius: 50%;
    background: rgba(255,255,255,0.9); color: var(--ink);
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; font-weight: 700;
  }

  /* ---------- TOP NAV ---------- */
  .top-nav {
    display: flex; gap: 10px; justify-content: center;
    background: rgba(255,255,255,0.85); border-radius: 999px;
    padding: 8px; margin: 0 auto 18px; max-width: 420px;
    box-shadow: 0 4px 16px rgba(31,75,67,0.1);
  }
  .bnav-btn {
    border: none; background: transparent; cursor: pointer;
    display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 8px;
    padding: 13px 22px; border-radius: 999px; color: var(--ink-soft);
    font-family: 'Baloo 2', sans-serif; font-size: 15.5px; font-weight: 700;
    flex: 1;
    transition: background .15s ease, color .15s ease;
  }
  .bnav-btn .bnav-icon { font-size: 22px; }
  .bnav-btn.active { background: var(--ink); color: white; }

  .home-header { text-align: center; margin-bottom: 16px; }
  .home-header .shelf-icon { font-size: 40px; line-height: 1; }
  .home-header h1 { font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 28px; margin: 6px 0 2px; }
  .home-header p { color: var(--ink-soft); margin: 0 0 8px; font-size: 15px; }

  /* ---------- READER ---------- */
  .reader { display: none; }
  .reader.active { display: block; }
  .home.hidden { display: none; }

  .top-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .back-btn {
    border: none; background: var(--paper); color: var(--ink);
    font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 14px;
    padding: 10px 16px; border-radius: 999px; cursor: pointer;
    box-shadow: 0 3px 0 rgba(0,0,0,0.08);
  }
  .cat-pill {
    font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 13px;
    color: white; padding: 7px 14px; border-radius: 999px;
  }

  .illustration {
    width: 100%; aspect-ratio: 16/9; border-radius: var(--radius);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 16px; overflow: hidden;
    position: relative;
  }
  .illustration svg { width: 78%; height: 78%; filter: drop-shadow(0 8px 10px rgba(0,0,0,0.22)); }
  .illustration img { width: 100%; height: 100%; object-fit: cover; }
  .illustration::before {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(circle at 28% 20%, rgba(255,255,255,0.55), transparent 55%);
    mix-blend-mode: soft-light;
    pointer-events: none;
  }

  .story-card {
    background: var(--paper);
    border-radius: var(--radius);
    padding: 24px 22px 20px;
    box-shadow: 0 4px 20px rgba(31,75,67,0.08);
  }
  .story-title {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 24px;
    margin: 0 0 14px;
  }
  .story-text {
    font-size: 19px;
    line-height: 1.75;
    color: #2A2420;
  }
  .story-text .word { transition: background .15s ease, border-radius .15s ease; padding: 1px 2px; }
  .story-text .word.active { background: #FFCD3C; border-radius: 6px; box-shadow: 0 0 0 2px #FFCD3C; }
  .story-text .word.moral-word { font-weight: 800; }

  .actions { display: flex; gap: 12px; margin-top: 20px; }
  .action-btn {
    flex: 1; border: none; cursor: pointer;
    font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 15px;
    padding: 14px 10px; border-radius: 16px;
    box-shadow: 0 4px 0 rgba(0,0,0,0.1);
    transition: transform .1s ease;
  }
  .action-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,0.1); }
  .action-btn.read { background: linear-gradient(135deg, #FF8A65, #E8546B); color: white; }
  .action-btn.shuffle { background: linear-gradient(135deg, #6FE3D0, #3FBEEA); color: white; border: none; }

  @media (max-width:380px){
    .home-header h1{ font-size: 27px; }
    .story-title{ font-size: 21px; }
    .story-text{ font-size: 17px; }
  }

  /* ---------- NAV TABS ---------- */
  .nav-tabs { display: flex; gap: 10px; justify-content: center; margin-bottom: 22px; }
  .nav-tab {
    border: none; cursor: pointer; font-family: 'Baloo 2', sans-serif; font-weight: 700;
    font-size: 15px; padding: 10px 22px; border-radius: 999px;
    background: #ffffffaa; color: var(--ink-soft);
  }
  .nav-tab.active { background: var(--ink); color: white; }

  /* ---------- PLAY HUB ---------- */
  .play-hub { display: none; }
  .play-hub.active { display: block; }
  .game-cards { display: grid; gap: 16px; }
  .game-card {
    border: none; cursor: pointer; text-align: left; display: flex; align-items: center; gap: 16px;
    border-radius: var(--radius); padding: 18px 20px; color: white;
    box-shadow: 0 6px 0 rgba(0,0,0,0.12); transition: transform .12s ease;
  }
  .game-card:active { transform: translateY(4px); }
  .game-card .g-emoji { font-size: 36px; }
  .game-card .g-name { font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 19px; display: block; }
  .game-card .g-desc { font-size: 13px; opacity: .92; margin-top: 2px; }
  .game-card.paint { background: linear-gradient(155deg, #FF9DCE, #E23E7F); }
  .game-card.match { background: linear-gradient(155deg, #7FE0C9, #1D97C2); }

  /* ---------- COLOR GAME ---------- */
  .game-screen { display: none; }
  .game-screen.active { display: block; }
  .template-row { display: flex; gap: 10px; margin-bottom: 12px; overflow-x: auto; }
  .template-btn {
    border: 2px solid #E4E0D6; background: var(--paper); border-radius: 14px;
    padding: 8px 14px; font-size: 22px; cursor: pointer; flex: none;
  }
  .template-btn.active { border-color: var(--hindi-dark); background: #FFE9F3; }
  .canvas-wrap {
    position: relative; width: 100%; aspect-ratio: 1/1; border-radius: var(--radius);
    background: var(--paper); box-shadow: 0 4px 20px rgba(31,75,67,0.08); overflow: hidden;
    margin-bottom: 14px;
  }
  #outlineLayer, #drawCanvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #outlineLayer svg { width: 100%; height: 100%; }
  #drawCanvas { touch-action: none; cursor: crosshair; }
  .palette-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .swatch {
    width: 34px; height: 34px; border-radius: 50%; border: 3px solid white;
    box-shadow: 0 0 0 2px #E4E0D6; cursor: pointer;
  }
  .swatch.active { box-shadow: 0 0 0 3px var(--ink); }
  .brush-row { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .brush-row span { font-size: 13px; color: var(--ink-soft); }
  .brush-dot { border: none; border-radius: 50%; background: var(--ink); cursor: pointer; }

  /* ---------- MATCH GAME ---------- */
  .match-prompt { text-align: center; margin: 10px 0 22px; }
  .match-emoji { font-size: 70px; }
  .match-score { font-family: 'Baloo 2', sans-serif; font-weight: 700; text-align: center; margin-bottom: 6px; }
  .match-options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .match-option {
    border: none; cursor: pointer; background: var(--paper);
    font-family: 'Lexend', sans-serif; font-size: 17px; font-weight: 500;
    padding: 18px 10px; border-radius: 16px; box-shadow: 0 4px 0 rgba(0,0,0,0.08);
  }
  .match-option.correct { background: #C9F0C0; box-shadow: 0 4px 0 #7FCB6C; }
  .match-option.wrong { background: #FFD3D3; box-shadow: 0 4px 0 #E8908F; }
  .match-done { text-align: center; }

  /* ---------- MATH MODE + TABLES ---------- */
  .mode-row { display: flex; gap: 10px; margin-bottom: 16px; }
  .mode-btn {
    flex: 1; border: 2px solid #E4E0D6; background: var(--paper); border-radius: 14px;
    padding: 10px 8px; font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 14px;
    cursor: pointer; color: var(--ink);
  }
  .mode-btn.active { border-color: var(--friend-dark); background: #FFF4DD; }
  .table-chip-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 18px; }
  .table-chip {
    width: 46px; height: 46px; border-radius: 50%; border: 2px solid #E4E0D6;
    background: var(--paper); font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 17px;
    cursor: pointer; color: var(--ink);
  }
  .table-chip.selected { border-color: var(--friend-dark); background: #FFD166; color: #5A3B00; }
  .table-select-hint { color: var(--ink-soft); font-size: 13px; margin-bottom: 4px; }
  .match-done .stars { font-size: 40px; margin: 14px 0; }

  .game-card.mathgame { background: linear-gradient(155deg, #FFD166, #E8A800); }
  .game-card.silentgame { background: linear-gradient(155deg, #B983FF, #7A4FD6); }

  /* ---------- NAME GATE ---------- */
  .full-overlay {
    position: fixed; inset: 0; z-index: 500;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    background:
      radial-gradient(circle at 10% 15%, #FFE9C7 0%, transparent 42%),
      radial-gradient(circle at 90% 20%, #C9F0E4 0%, transparent 44%),
      radial-gradient(circle at 20% 90%, #FFD9EC 0%, transparent 42%),
      radial-gradient(circle at 88% 88%, #D6E9FF 0%, transparent 44%),
      var(--bg);
  }
  #nameGate {
    background-image: url('https://raw.githubusercontent.com/johnlewis9509-byte/Story/refs/heads/main/pic1.png');
    background-size: cover;
    background-position: center;
  }
  .full-overlay.hidden { display: none; }
  .full-overlay.hidden { display: none; }
  .gate-card {
    max-width: 420px; width: 100%; background: var(--paper);
    border-radius: var(--radius); padding: 30px 26px; text-align: center;
    box-shadow: 0 10px 30px rgba(31,75,67,0.15);
  }
  .gate-card h1 { font-family: 'Baloo 2', sans-serif; font-size: 26px; margin: 4px 0 6px; }
  .gate-card p { color: var(--ink-soft); font-size: 14px; margin: 0 0 20px; }
  .gate-input {
    width: 100%; padding: 14px 16px; border-radius: 14px; border: 2px solid #E4E0D6;
    font-family: 'Lexend', sans-serif; font-size: 17px; margin-bottom: 18px; text-align: center;
  }
  .gate-input:focus { outline: none; border-color: var(--hindi-dark); }
  .gender-row { display: flex; gap: 14px; margin-bottom: 22px; }
  .gender-btn {
    flex: 1; border: 3px solid #E4E0D6; background: white; border-radius: 18px;
    padding: 16px 8px; cursor: pointer; font-family: 'Baloo 2', sans-serif; font-weight: 700;
  }
  .gender-btn .g-face { font-size: 34px; display: block; margin-bottom: 6px; }
  .gender-btn.selected { border-color: var(--hindi-dark); background: #FFE9F3; }
  .begin-btn {
    width: 100%; border: none; cursor: pointer; padding: 16px; border-radius: 16px;
    font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 17px; color: white;
    background: linear-gradient(135deg, #FF8A65, #E8546B);
    box-shadow: 0 4px 0 rgba(0,0,0,0.12);
  }
  .begin-btn:disabled { opacity: .45; cursor: not-allowed; }

  /* ---------- GREETING ---------- */
  .greet-character { width: 200px; height: 220px; margin: 0 auto 10px; }
  .greet-character svg { width: 100%; height: 100%; filter: drop-shadow(0 10px 14px rgba(0,0,0,0.2)); }
  .speech-bubble {
    background: white; border-radius: 20px; padding: 16px 20px; position: relative;
    font-size: 16px; line-height: 1.5; margin: 10px auto 22px; max-width: 360px;
    box-shadow: 0 4px 20px rgba(31,75,67,0.1);
  }
  .speech-bubble::after {
    content: ''; position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
    border-width: 0 10px 12px 10px; border-style: solid;
    border-color: transparent transparent white transparent;
  }

  /* ---------- CELEBRATION OVERLAY ---------- */
  .celebrate-overlay {
    position: fixed; inset: 0; z-index: 900;
    display: flex; align-items: center; justify-content: center; flex-direction: column;
    opacity: 0; pointer-events: none; transition: opacity .25s ease;
    background: rgba(255,255,255,0.001); overflow: hidden;
  }
  .celebrate-overlay.show { opacity: 1; }
  .celebrate-overlay .big-emoji { font-size: 90px; animation: pop-in .45s ease; }
  .celebrate-overlay .celebrate-text {
    font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 24px;
    margin-top: 8px; background: white; padding: 8px 22px; border-radius: 999px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.15);
  }
  .celebrate-overlay.good .celebrate-text { color: #2E9E4F; }
  .celebrate-overlay.bad .celebrate-text { color: #D8536B; }
  .celebrate-overlay.bad .big-emoji { animation: shake .5s ease; }
  @keyframes pop-in { 0%{ transform: scale(0.3); opacity:0; } 60%{ transform: scale(1.15); opacity:1; } 100%{ transform: scale(1); } }
  @keyframes shake { 0%,100%{ transform: translateX(0); } 25%{ transform: translateX(-10px); } 75%{ transform: translateX(10px); } }
  .confetti-piece {
    position: absolute; top: -8%; width: 10px; height: 14px; border-radius: 2px;
    animation: confetti-fall linear forwards;
  }
  @keyframes confetti-fall {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(115vh) rotate(360deg); opacity: 0; }
  }
</style>
</head>
<body>

<!-- NAME GATE -->
<div class="full-overlay" id="nameGate">
  <div class="gate-card">
    <div style="font-size:40px;">👋</div>
    <h1>Who's Reading Today?</h1>
    <p>Enter your name to begin!</p>
    <input class="gate-input" id="childNameInput" type="text" placeholder="Type your name" maxlength="20">
    <div class="gender-row">
      <button class="gender-btn" id="genderBoyBtn"><span class="g-face">👦</span>Boy</button>
      <button class="gender-btn" id="genderGirlBtn"><span class="g-face">👧</span>Girl</button>
    </div>
    <button class="begin-btn" id="beginBtn" disabled>Let's Begin! ▶</button>
  </div>
</div>

<!-- GREETING -->
<div class="full-overlay hidden" id="greetingScreen">
  <div class="gate-card">
    <div class="greet-character" id="greetCharacter"></div>
    <div class="speech-bubble" id="greetBubble"></div>
    <button class="begin-btn" id="startReadingBtn">Start Reading 📖</button>
  </div>
</div>

<div id="app">

  <!-- HOME -->
  <div class="home" id="homeView">
    <div class="hero-scene">
      <div class="hero-content">
        <div class="greet-badge" id="greetBadge" style="display:none;">
          <div class="avatar" id="greetBadgeAvatar"></div>
          <span id="greetBadgeText">Hi!</span>
        </div>
      </div>
    </div>

    <div class="top-nav" id="topNavHome">
      <button class="bnav-btn active" data-tab="home"><span class="bnav-icon">🏠</span>Home</button>
      <button class="bnav-btn" data-tab="play"><span class="bnav-icon">🎮</span>Play</button>
    </div>

    <div class="cat-list" id="tiles"></div>

    <div style="text-align:center;">
      <div class="wood-sign-mini">Reading Makes a Happier You ❤️</div>
    </div>
  </div>

  <!-- PLAY HUB -->
  <div class="play-hub" id="playHub">
    <div class="home-header">
      <div class="shelf-icon">🎮</div>
      <h1>Play &amp; Learn</h1>
      <p>Games to go with your stories!</p>
    </div>
    <div class="top-nav" id="topNavPlay">
      <button class="bnav-btn" data-tab="home"><span class="bnav-icon">🏠</span>Home</button>
      <button class="bnav-btn active" data-tab="play"><span class="bnav-icon">🎮</span>Play</button>
    </div>
    <div class="game-cards">
      <button class="game-card paint" id="openPaint">
        <span class="g-emoji">🎨</span>
        <span>
          <span class="g-name">Coloring Pad</span>
          <span class="g-desc">Pick a picture and paint it!</span>
        </span>
      </button>
      <button class="game-card match" id="openMatch">
        <span class="g-emoji">🔤</span>
        <span>
          <span class="g-name">Word Match</span>
          <span class="g-desc">Match the picture to the right word</span>
        </span>
      </button>
      <button class="game-card mathgame" id="openMath">

  { cat:'adventure', title:"Sailing to Coconut Island",

  { cat:'adventure', title:"The Secret Cave",

  { cat:'adventure', title:"The Lost Compass",

    text:"Aditya's compass shattered on the first day of his mountain trek, and his group panicked, wanting to turn back. Aditya remembered the position of the setting sun his grandfather had taught him and guided everyone using shadows and stars instead. Three days later, they reached the summit safely, cheering together. Aditya realized tools help, but courage and calm thinking matter more when things go wrong. Courage and a calm mind can guide you even when your tools fail." },
  { cat:'adventure', title:"The River Crossing",

  { cat:'adventure', title:"Cave of Echoes",

  { cat:'adventure', title:"Island of Whispers",

/* ---------------- READER LOGIC ---------------- */
const categoryQueues = {}; // catId -> { order: [storyIndices], pos: number }

function buildQueue(catId, avoidFirstTitle){
  const list = STORIES.filter(s => s.cat === catId);
  let order = shuffleArr(list.map((_, i) => i));
  // avoid immediately repeating the story we just finished, when possible
  if (avoidFirstTitle && list.length > 1 && list[order[0]].title === avoidFirstTitle) {
    order.push(order.shift());
  }
  categoryQueues[catId] = { order, pos: 0 };
}

function getNextStory(catId){
  const list = STORIES.filter(s => s.cat === catId);
  let q = categoryQueues[catId];
  if (!q || q.pos >= q.order.length) {
    buildQueue(catId, currentStory ? currentStory.title : null);
    q = categoryQueues[catId];
  }
  const story = list[q.order[q.pos]];
  q.pos++;
  return story;
}

function openCategory(catId){
  buildQueue(catId);
  showStory(getNextStory(catId));
}

function showStory(story){
  stopSpeaking();
  currentStory = story;
  const cat = CATEGORIES.find(c => c.id === story.cat);
  catPill.textContent = cat.name;
  catPill.style.background = cat.color;
  illustrationEl.innerHTML = story.image
    ? `<img src="${story.image}" alt="${story.title}" onerror="this.parentElement.innerHTML=illustrationFor('${story.cat}')">`
    : illustrationFor(story.cat);
  illustrationEl.style.background = `${cat.color}22`;
  storyTitleEl.textContent = story.title;
  renderStoryText(story.text);
  readBtn.textContent = '🔊 Read to me';

  showSection('reader');
}

function renderStoryText(text){
  storyTextEl.innerHTML = '';
  let charPos = 0;

  // Find the start position of the last sentence (the moral line) so it can be bolded.
  const sentenceMatches = text.match(/[^.!?]+[.!?]+(\s|$)/g);
  let moralStart = -1;
  if (sentenceMatches && sentenceMatches.length > 1) {
    const lastSentence = sentenceMatches[sentenceMatches.length - 1];
    moralStart = text.lastIndexOf(lastSentence.trim());
  }

  text.split(/(\s+)/).forEach(tok => {
    if (/^\s+$/.test(tok)) {
      storyTextEl.appendChild(document.createTextNode(tok));
      charPos += tok.length;
    } else if (tok.length) {
      const span = document.createElement('span');
      span.className = 'word';
      if (moralStart !== -1 && charPos >= moralStart) span.classList.add('moral-word');
      span.textContent = tok;
      span.dataset.start = charPos;
      span.dataset.end = charPos + tok.length;
      storyTextEl.appendChild(span);
      charPos += tok.length;
    }
  });
}

/* ---------------- READ ALOUD ---------------- */
let highlightTimer = null;
let highlightWordIndex = 0;
let highlightWords = [];
let highlightRemainingMs = 0;
let highlightWordStartedAt = 0;
let highlightCurrentDuration = 0;

function stopSpeaking(){
  if ('speechSynthesis' in window) window.speechSynthesis.cancel();
  clearTimeout(highlightTimer);
  speechState = 'idle';
  readBtn.textContent = '🔊 Read to me';
  storyTextEl.querySelectorAll('.word.active').forEach(w => w.classList.remove('active'));
}

function pickBestVoice(lang){
  const voices = window.speechSynthesis.getVoices();
  const base = lang.split('-')[0];
  return voices.find(v => v.lang === lang)
    || voices.find(v => v.lang && v.lang.startsWith(base))
    || null;
}

/* Estimated, timer-driven word highlighting.
   This does NOT rely on the browser's speechSynthesis "onboundary" event,
   which is unreliable (often never fires) on Android Chrome/WebView.
   Instead, each word is highlighted for a duration estimated from its
   length and the current speech rate, so highlighting works everywhere. */
function highlightNextWord(rate){
  highlightWords.forEach(w => w.classList.remove('active'));
  if (highlightWordIndex >= highlightWords.length) return;

  const w = highlightWords[highlightWordIndex];
  w.classList.add('active');
  w.scrollIntoView({ block: 'nearest', behavior: 'smooth' });

  const charCount = w.textContent.length;
  const msPerChar = 48 / rate;
  let duration = Math.max(150, charCount * msPerChar);
  if (/[.,!?;:]$/.test(w.textContent)) duration += 200;

  highlightCurrentDuration = duration;
  highlightWordStartedAt = Date.now();
  highlightWordIndex++;
  highlightTimer = setTimeout(() => highlightNextWord(rate), duration);
}

function startSpeaking(){
  const utter = new SpeechSynthesisUtterance(currentStory.text);
  utter.lang = currentStory.lang || 'en-US';
  utter.rate = 0.68;   // slowed down for young/early readers
  utter.pitch = 1.0;

  const voice = pickBestVoice(utter.lang);
  if (voice) utter.voice = voice;

  highlightWords = [...storyTextEl.querySelectorAll('.word')];
  highlightWordIndex = 0;
  clearTimeout(highlightTimer);

  utter.onstart = () => highlightNextWord(utter.rate);
  utter.onend = () => stopSpeaking();
  utter.onerror = () => stopSpeaking();

  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(utter);
  speechState = 'speaking';
  readBtn.textContent = '⏸ Pause reading';
}

function toggleRead(){
  if (!('speechSynthesis' in window)) {
    alert("Sorry, this device can't read aloud.");
    return;
  }
  if (speechState === 'idle') {
    startSpeaking();
  } else if (speechState === 'speaking') {
    window.speechSynthesis.pause();
    clearTimeout(highlightTimer);
    highlightRemainingMs = Math.max(0, highlightCurrentDuration - (Date.now() - highlightWordStartedAt));
    speechState = 'paused';
    readBtn.textContent = '▶ Resume reading';
  } else if (speechState === 'paused') {
    window.speechSynthesis.resume();
    highlightWordStartedAt = Date.now();
    highlightCurrentDuration = highlightRemainingMs;
    highlightTimer = setTimeout(() => highlightNextWord(0.68), highlightRemainingMs);
    speechState = 'speaking';
    readBtn.textContent = '⏸ Pause reading';
  }
}

    document.getElementById('brushMed').onclick = () => currentBrush = 8;
    document.getElementById('brushLarge').onclick = () => currentBrush = 16;
    document.getElementById('clearCanvasBtn').onclick = () => ctx && ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);

    const canvas = document.getElementById('drawCanvas');
    const wrap = canvas.parentElement;
    const resize = () => {
      const rect = wrap.getBoundingClientRect();
      canvas.width = rect.width; canvas.height = rect.height;
    };
    window.addEventListener('resize', resize);
    resize();
    ctx = canvas.getContext('2d');
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';

    const pos = (e) => {
      const rect = canvas.getBoundingClientRect();
      const p = e.touches ? e.touches[0] : e;
      return { x: p.clientX - rect.left, y: p.clientY - rect.top };
    };
    const start = (e) => { drawing = true; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); e.preventDefault(); };
    const move = (e) => {
      if (!drawing) return;
      const p = pos(e);
      ctx.strokeStyle = currentColor; ctx.lineWidth = currentBrush;
      ctx.lineTo(p.x, p.y); ctx.stroke();
      e.preventDefault();
    };
    const end = () => { drawing = false; };
    canvas.addEventListener('mousedown', start);
    canvas.addEventListener('mousemove', move);
    window.addEventListener('mouseup', end);
    canvas.addEventListener('touchstart', start, { passive: false });
    canvas.addEventListener('touchmove', move, { passive: false });
    canvas.addEventListener('touchend', end);

    setTemplate('fox');
  }
}

/* ---------------- CELEBRATION SOUNDS ---------------- */
let audioCtx = null;
function getAudioCtx(){
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function playTone(freq, startTime, duration, type = 'sine', peakVol = 0.25){
  const ctx = getAudioCtx();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, startTime);
  gain.gain.setValueAtTime(0.0001, startTime);
  gain.gain.exponentialRampToValueAtTime(peakVol, startTime + 0.03);
  gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
  osc.connect(gain).connect(ctx.destination);
  osc.start(startTime);
  osc.stop(startTime + duration + 0.05);
}

function playClapNoise(startTime, duration){
  const ctx = getAudioCtx();
  const bufferSize = Math.floor(ctx.sampleRate * duration);
  const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) {
    data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
  }
  const noise = ctx.createBufferSource();
  noise.buffer = buffer;
  const filter = ctx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.frequency.value = 1500;
  const gain = ctx.createGain();
  gain.gain.setValueAtTime(0.35, startTime);
  gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
  noise.connect(filter).connect(gain).connect(ctx.destination);
  noise.start(startTime);
}

function playWinSound(){
  try {
    const ctx = getAudioCtx();
    const now = ctx.currentTime;
    // Happy ascending chime (like a "ta-da!")
    const notes = [523.25, 659.25, 783.99, 1046.50]; // C5 E5 G5 C6
    notes.forEach((f, i) => playTone(f, now + i * 0.09, 0.35, 'triangle', 0.22));
    // A few quick claps for texture
    for (let i = 0; i < 4; i++) {
      playClapNoise(now + 0.05 + i * 0.09, 0.08);
    }
  } catch (e) { /* audio not available, fail silently */ }
}

function playTryAgainSound(){
  try {
    const ctx = getAudioCtx();
    const now = ctx.currentTime;
    playTone(392.00, now, 0.18, 'sine', 0.15);
    playTone(329.63, now + 0.16, 0.28, 'sine', 0.15);
  } catch (e) { /* audio not available, fail silently */ }
}

      piece.style.background = CONFETTI_COLORS[i % CONFETTI_COLORS.length];
      piece.style.animationDuration = (1.4 + Math.random() * 1.1) + 's';
      piece.style.animationDelay = (Math.random() * 0.3) + 's';
      overlay.appendChild(piece);
    }
    const emoji = document.createElement('div');
    emoji.className = 'big-emoji';
    emoji.textContent = ['🎉','👏','⭐'][Math.floor(Math.random()*3)];
    overlay.appendChild(emoji);
    const text = document.createElement('div');
    text.className = 'celebrate-text';
    text.textContent = ['Great job!','Well done!','You got it!'][Math.floor(Math.random()*3)];
    overlay.appendChild(text);
  } else {
    const emoji = document.createElement('div');
    emoji.className = 'big-emoji';
    emoji.textContent = '😢';
    overlay.appendChild(emoji);
    const text = document.createElement('div');
    text.className = 'celebrate-text';
    text.textContent = 'Try again!';
    overlay.appendChild(text);
  }

  document.body.appendChild(overlay);
  requestAnimationFrame(() => overlay.classList.add('show'));
  setTimeout(() => {
    overlay.classList.remove('show');
    setTimeout(() => overlay.remove(), 300);
  }, 1200);
}

/* ---------------- WORD MATCH GAME ---------------- */
const WORD_BANK = [
  { emoji:'🦊', word:'Fox' }, { emoji:'🐢', word:'Turtle' }, { emoji:'🐭', word:'Mouse' },
  { emoji:'🏰', word:'Castle' }, { emoji:'🐉', word:'Dragon' }, { emoji:'⭐', word:'Star' },
  { emoji:'⛵', word:'Boat' }, { emoji:'🗺️', word:'Map' }, { emoji:'💎', word:'Cave' },
  { emoji:'🤝', word:'Friends' }, { emoji:'☂️', word:'Umbrella' }, { emoji:'🍪', word:'Cookie' },
  { emoji:'🪁', word:'Kite' }, { emoji:'🪔', word:'Lamp' },
];
let matchRounds = [], matchIndex = 0, matchScore = 0, matchAdvanceTimer = null;
const TOTAL_ROUNDS = 6;

function shuffleArr(arr){ return [...arr].sort(() => Math.random() - 0.5); }

function startMatchGame(){
  clearTimeout(matchAdvanceTimer);
  matchRounds = shuffleArr(WORD_BANK).slice(0, TOTAL_ROUNDS);
  matchIndex = 0; matchScore = 0;
  document.getElementById('matchDone').style.display = 'none';
  document.getElementById('matchPlayArea').style.display = 'block';
  showMatchRound();
}

function showMatchRound(){
  if (matchIndex >= matchRounds.length) { finishMatchGame(); return; }
  const round = matchRounds[matchIndex];
  document.getElementById('matchScore').textContent = `Star ${matchIndex + 1} of ${matchRounds.length} · Score: ${matchScore}`;
  document.getElementById('matchEmoji').textContent = round.emoji;

  const wrongPool = shuffleArr(WORD_BANK.filter(w => w.word !== round.word)).slice(0, 3);
  const options = shuffleArr([round, ...wrongPool]);

  const optionsEl = document.getElementById('matchOptions');
  optionsEl.innerHTML = '';
  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'match-option';
    btn.textContent = opt.word;
    btn.onclick = () => {
      const allBtns = optionsEl.querySelectorAll('.match-option');
      allBtns.forEach(b => b.disabled = true);
      if (opt.word === round.word) {
        btn.classList.add('correct');
        matchScore++;
        celebrate(true);
        clearTimeout(matchAdvanceTimer);
        matchAdvanceTimer = setTimeout(() => { matchIndex++; showMatchRound(); }, 1500);
      } else {
        btn.classList.add('wrong');
        [...allBtns].find(b => b.textContent === round.word).classList.add('correct');
        celebrate(false);
        clearTimeout(matchAdvanceTimer);
        matchAdvanceTimer = setTimeout(() => { matchIndex++; showMatchRound(); }, 1900);
      }
    };
    optionsEl.appendChild(btn);
  });
}

function finishMatchGame(){
  document.getElementById('matchPlayArea').style.display = 'none';
  const doneEl = document.getElementById('matchDone');
  doneEl.style.display = 'block';
  document.getElementById('matchStars').textContent = '⭐'.repeat(matchScore) + '☆'.repeat(matchRounds.length - matchScore);
  document.getElementById('matchDoneText').textContent = `You got ${matchScore} out of ${matchRounds.length} right! Great reading!`;
}

/* ---------------- MATH GAME ---------------- */
let mathRounds = [], mathIndex = 0, mathScore = 0, mathAdvanceTimer = null;
const MATH_TOTAL_ROUNDS = 6;
let mathMode = 'as'; // 'as' = add/subtract, 'tables' = times tables
let selectedTables = new Set([2,3,4,5,6,7,8,9,10]);

function generateAddSubQuestion(){
  const isAdd = Math.random() < 0.6;
  let a = Math.floor(Math.random() * 10) + 1;
  let b = Math.floor(Math.random() * 10) + 1;
  let op, answer;
  if (isAdd) {
    op = '+'; answer = a + b;
  } else {
    if (b > a) { const t = a; a = b; b = t; }
    op = '−'; answer = a - b;
  }
  const options = new Set([answer]);
  while (options.size < 4) {
    const delta = Math.floor(Math.random() * 5) - 2;
    const cand = answer + delta;
    if (cand >= 0 && !options.has(cand)) options.add(cand);
  }
  return { prompt: `${a} ${op} ${b} = ?`, answer, options: shuffleArr([...options]) };
}

function generateTablesQuestion(){
  const tables = [...selectedTables];
  const a = tables[Math.floor(Math.random() * tables.length)];
  const b = Math.floor(Math.random() * 10) + 1; // 1 to 10
  const answer = a * b;
  const options = new Set([answer]);
  while (options.size < 4) {
    const delta = Math.floor(Math.random() * 7) - 3;
    const cand = answer + delta * a || answer + delta;
    if (cand >= 0 && !options.has(cand)) options.add(cand);
  }
  return { prompt: `${a} × ${b} = ?`, answer, options: shuffleArr([...options]) };
}

function generateMathQuestion(){
  return mathMode === 'tables' ? generateTablesQuestion() : generateAddSubQuestion();
}

function startMathGame(){
  clearTimeout(mathAdvanceTimer);

  mathIndex = 0; mathScore = 0;
  document.getElementById('mathDone').style.display = 'none';
  document.getElementById('mathPlayArea').style.display = 'block';
  showMathRound();
}

function showMathRound(){
  if (mathIndex >= mathRounds.length) { finishMathGame(); return; }
  const round = mathRounds[mathIndex];
  document.getElementById('mathScore').textContent = `Question ${mathIndex + 1} of ${mathRounds.length} · Score: ${mathScore}`;
  document.getElementById('mathPrompt').textContent = round.prompt;

  const optionsEl = document.getElementById('mathOptions');
  optionsEl.innerHTML = '';
  round.options.forEach(val => {
    const btn = document.createElement('button');
    btn.className = 'match-option';
    btn.textContent = val;
    btn.onclick = () => {
      const allBtns = optionsEl.querySelectorAll('.match-option');
      allBtns.forEach(b => b.disabled = true);
      if (val === round.answer) {
        btn.classList.add('correct');
        mathScore++;
        celebrate(true);
        clearTimeout(mathAdvanceTimer);
        mathAdvanceTimer = setTimeout(() => { mathIndex++; showMathRound(); }, 1500);
      } else {
        btn.classList.add('wrong');
        [...allBtns].find(b => Number(b.textContent) === round.answer).classList.add('correct');
        celebrate(false);
        clearTimeout(mathAdvanceTimer);
        mathAdvanceTimer = setTimeout(() => { mathIndex++; showMathRound(); }, 1900);
      }
    };
    optionsEl.appendChild(btn);
  });
}

function finishMathGame(){
  document.getElementById('mathPlayArea').style.display = 'none';
  document.getElementById('mathDone').style.display = 'block';
  document.getElementById('mathStars').textContent = '⭐'.repeat(mathScore) + '☆'.repeat(mathRounds.length - mathScore);
  document.getElementById('mathDoneText').textContent = `You got ${mathScore} out of ${mathRounds.length} right! Super counting!`;
}

/* ---------------- SILENT LETTER GAME ---------------- */
const SILENT_WORD_BANK = [
  { word: 'knife', silent: 'k' },
  { word: 'comb', silent: 'b' },
  { word: 'sign', silent: 'g' },
  { word: 'listen', silent: 't' },
  { word: 'write', silent: 'w' },
  { word: 'thumb', silent: 'b' },
  { word: 'gnome', silent: 'g' },
  { word: 'wrist', silent: 'w' },
  { word: 'island', silent: 's' },
  { word: 'half', silent: 'l' },
];
let silentRounds = [], silentIndex = 0, silentScore = 0, silentAdvanceTimer = null;
const SILENT_TOTAL_ROUNDS = 6;

function letterOptionsFor(item){
  const letters = [...new Set(item.word.split(''))];
  const others = shuffleArr(letters.filter(l => l !== item.silent)).slice(0, 3);
  return shuffleArr([item.silent, ...others]);
}

function startSilentGame(){
  clearTimeout(silentAdvanceTimer);
  silentRounds = shuffleArr(SILENT_WORD_BANK).slice(0, SILENT_TOTAL_ROUNDS);
  silentIndex = 0; silentScore = 0;
  document.getElementById('silentDone').style.display = 'none';
  document.getElementById('silentPlayArea').style.display = 'block';
  showSilentRound();
}

function showSilentRound(){
  if (silentIndex >= silentRounds.length) { finishSilentGame(); return; }
  const round = silentRounds[silentIndex];
  document.getElementById('silentScore').textContent = `Word ${silentIndex + 1} of ${silentRounds.length} · Score: ${silentScore}`;
  document.getElementById('silentWord').textContent = round.word.toUpperCase();

  const optionsEl = document.getElementById('silentOptions');
  optionsEl.innerHTML = '';
  letterOptionsFor(round).forEach(letter => {
    const btn = document.createElement('button');
    btn.className = 'match-option';
    btn.textContent = letter.toUpperCase();
    btn.onclick = () => {
      const allBtns = optionsEl.querySelectorAll('.match-option');
      allBtns.forEach(b => b.disabled = true);
      if (letter === round.silent) {
        btn.classList.add('correct');
        silentScore++;
        celebrate(true);
        clearTimeout(silentAdvanceTimer);
        silentAdvanceTimer = setTimeout(() => { silentIndex++; showSilentRound(); }, 1500);
      } else {
        btn.classList.add('wrong');
        [...allBtns].find(b => b.textContent === round.silent.toUpperCase()).classList.add('correct');
        celebrate(false);
        clearTimeout(silentAdvanceTimer);
        silentAdvanceTimer = setTimeout(() => { silentIndex++; showSilentRound(); }, 1900);
      }
    };
    optionsEl.appendChild(btn);
  });
}

function finishSilentGame(){
  document.getElementById('silentPlayArea').style.display = 'none';
  document.getElementById('silentDone').style.display = 'block';
  document.getElementById('silentStars').textContent = '⭐'.repeat(silentScore) + '☆'.repeat(silentRounds.length - silentScore);
  document.getElementById('silentDoneText').textContent = `You found ${silentScore} out of ${silentRounds.length} silent letters! Nice detective work!`;
}
document.getElementById('playAgainSilentBtn').onclick = startSilentGame;

function refreshBeginBtn(){

}

genderBoyBtn.onclick = () => {
  childGender = 'boy';

};
genderGirlBtn.onclick = () => {
  childGender = 'girl';

  refreshBeginBtn();
};

beginBtn.onclick = () => {

};

function showGreeting(){
  const greetImg = childGender === 'girl' ? 'https://raw.githubusercontent.com/johnlewis9509-byte/Story/refs/heads/main/Girl.png' : 'https://raw.githubusercontent.com/johnlewis9509-byte/Story/refs/heads/main/Boy.png';
  document.getElementById('greetCharacter').innerHTML = '<img src="' + greetImg + '" style="width:100%;height:100%;object-fit:contain;">';
  const message = `Hi, dear ${childName}! Hope you are doing well. Let's start today's story.`;
  document.getElementById('greetBubble').textContent = message;
  greetingScreen.classList.remove('hidden');

  if ('speechSynthesis' in window) {
    const utter = new SpeechSynthesisUtterance(message);
    utter.lang = 'en-US';
    utter.rate = 0.95;
    utter.pitch = childGender === 'girl' ? 1.15 : 0.95;
    const voice = pickBestVoice('en-US');
    if (voice) utter.voice = voice;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(utter);
  }
}

document.getElementById('startReadingBtn').onclick = () => {
  window.speechSynthesis && window.speechSynthesis.cancel();
  greetingScreen.classList.add('hidden');

  document.getElementById('greetBadgeAvatar').innerHTML = characterSVG(childGender);
  document.getElementById('greetBadgeText').textContent = `Hi, ${childName}! 👋`;
};
